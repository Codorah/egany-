    <!-- Instant theme initialization to prevent flickers -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('eganye_theme');
          if (!theme) {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.add('light');
          }
        } catch (e) {
          console.error(e);
        }
      })();
    </script>

    <!-- Repli sans JavaScript. Sert deux publics : les robots d'indexation
         qui n'exécutent pas JavaScript (ils ne voyaient jusqu'ici qu'une
         division vide), et la visiteuse dont le navigateur bloque les
         scripts. Le contenu décrit le service réellement rendu — pas de
         texte caché destiné aux seuls moteurs. -->
    <noscript>
      <main style="max-width:40rem;margin:0 auto;padding:2rem 1rem;font-family:system-ui,sans-serif;color:#211810;line-height:1.6">
        <h1>eganyé — la tontine digitale</h1>
        <p>
          eganyé digitalise la tontine, cette pratique d'épargne en cercle où
          chaque membre cotise à tour de rôle et reçoit la cagnotte quand son
          tour arrive.
        </p>
        <h2>Ce que permet l'application</h2>
        <ul>
          <li>Créer un cercle d'épargne journalier, hebdomadaire ou mensuel</li>
          <li>Suivre les cotisations de chaque membre en toute transparence</li>
          <li>Définir l'ordre des tours, par tirage au sort ou ordre fixe</li>
          <li>Cotiser et encaisser par Mobile Money (T-Money, Moov, Wave, Orange Money)</li>
          <li>Bâtir un score de fiabilité fondé sur la ponctualité des versements</li>
          <li>Mettre de côté dans une banque personnelle à objectif</li>
        </ul>
        <p>
          Pensée pour les commerçantes et la jeunesse du Togo et d'Afrique de
          l'Ouest. L'application nécessite JavaScript pour fonctionner :
          veuillez l'activer, puis recharger la page.
        </p>
      </main>
    </noscript>
