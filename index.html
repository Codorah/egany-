<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>eganyé — Épargne en cercle & tontine</title>
    <meta name="description" content="Gérez vos cercles d'épargne (tontines) en Afrique de l'Ouest : cotisations, tours de distribution, portefeuille et score de fiabilité, le tout dans une seule application." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    
    <!-- Instant theme initialization to prevent flickers -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('eganye_theme');
          if (!theme) {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.add('light');
          }
        } catch (e) {
          console.error(e);
        }
      })();
    </script>
    
    <!-- PWA Meta tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#C15B2A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="eganyé" />
  </head>
  <body class="bg-[#F6F1E7] dark:bg-[#1C1712]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
