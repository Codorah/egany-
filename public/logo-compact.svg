  <path d="M26 32H40C46.6274 32 52 37.3726 52 44C52 50.6274 46.6274 56 40 56C34 56 30 52 28 48" stroke="url(#eganyeTerracotta)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- 4. Pièce d'or centrale étincelante (Eganyé = Mon Argent) -->
